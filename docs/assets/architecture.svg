<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">How a Slack mention becomes an answer</title>
  <desc id="d">Slack sends a mention to the gateway on Vercel Functions. The gateway keeps run state in Upstash Redis, can fetch one public link, and starts a run on the worker inside a Vercel Sandbox. The worker runs the Pi agent, which calls the model on OpenRouter through the Sandbox firewall. Sessions and files live on a Vercel Drive. The worker sends the answer to the gateway, which posts it to Slack.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#57606a"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #afb8c1; stroke-width: 1.5; }
      .in { fill: #f6f8fa; stroke: #afb8c1; stroke-width: 1.5; }
      .h { font-size: 15px; font-weight: 600; fill: #1f2328; text-anchor: middle; }
      .s { font-size: 12px; fill: #57606a; text-anchor: middle; }
      .l { font-size: 11.5px; fill: #57606a; text-anchor: middle; }
      .ar { stroke: #57606a; stroke-width: 1.5; fill: none; marker-end: url(#a); }
      .both { marker-start: url(#a); }
      .n { fill: #1f2328; }
      .nt { font-size: 11px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    </style>
  </defs>

  <rect x="1" y="1" width="918" height="458" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>

  <text x="40" y="58" font-size="17" font-weight="600" fill="#1f2328">From a mention to an answer</text>
  <text x="40" y="80" font-size="12.5" fill="#57606a">The numbers match the steps below.</text>

  <!-- Slack -->
  <rect class="box" x="40" y="200" width="150" height="90" rx="10"/>
  <text class="h" x="115" y="241">Slack</text>
  <text class="s" x="115" y="261">one channel</text>

  <!-- Gateway -->
  <rect x="300" y="170" width="200" height="150" rx="10" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/>
  <text class="h" x="400" y="200">Gateway</text>
  <text class="s" x="400" y="219">Vercel Functions</text>
  <text class="s" x="400" y="254">checks who is asking</text>
  <text class="s" x="400" y="274">holds the Slack and Redis keys</text>
  <text class="s" x="400" y="294">posts status and answers</text>

  <!-- Redis and public link -->
  <rect class="box" x="280" y="380" width="115" height="56" rx="10"/>
  <text class="h" x="337.5" y="404" font-size="13">Upstash Redis</text>
  <text class="s" x="337.5" y="422">run state, locks</text>
  <rect class="box" x="405" y="380" width="115" height="56" rx="10"/>
  <text class="h" x="462.5" y="404">Public URL</text>
  <text class="s" x="462.5" y="422">one HTTPS link</text>
  <path class="ar both" d="M347 322V378"/>
  <path class="ar" d="M452 322V378" stroke-dasharray="4 4"/>

  <!-- Sandbox -->
  <rect x="620" y="120" width="270" height="252" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="636" y="146" font-size="13" font-weight="600" fill="#1f2328">Vercel Sandbox</text>
  <text class="s" x="755" y="360">no keys · no shell</text>

  <rect class="in" x="640" y="170" width="95" height="56" rx="10"/>
  <text class="h" x="687.5" y="203">Worker</text>
  <rect class="in" x="775" y="170" width="95" height="56" rx="10"/>
  <text class="h" x="822.5" y="203">Pi agent</text>
  <rect class="in" x="640" y="280" width="230" height="56" rx="10"/>
  <text class="h" x="755" y="304">Vercel Drive</text>
  <text class="s" x="755" y="322">sessions and files, kept between runs</text>
  <path class="ar" d="M737 198H773"/>
  <path class="ar both" d="M687.5 228V278"/>
  <path class="ar both" d="M822.5 228V278"/>

  <!-- OpenRouter -->
  <rect class="box" x="760" y="24" width="125" height="56" rx="10"/>
  <text class="h" x="822.5" y="48">OpenRouter</text>
  <text class="s" x="822.5" y="66">the model</text>
  <path class="ar" d="M822.5 168V82"/>
  <rect x="757" y="109" width="131" height="22" rx="11" fill="#fff8c5" stroke="#d4a72c"/>
  <text x="822.5" y="124" font-size="11.5" fill="#7d4e00" text-anchor="middle">firewall adds the key</text>

  <!-- Slack and gateway -->
  <path class="ar" d="M192 228H298"/>
  <text class="l" x="245" y="214">mention, reply, click</text>
  <path class="ar" d="M298 262H192"/>
  <text class="l" x="245" y="286">status, answer, file</text>

  <!-- Gateway and worker -->
  <path class="ar" d="M502 186H638"/>
  <text class="l" x="560" y="170">inputs, start run</text>
  <path class="ar" d="M638 212H502"/>
  <text class="l" x="560" y="238">progress, answer</text>

  <!-- Step numbers, matching the list in the README -->
  <circle class="n" cx="245" cy="228" r="9"/><text class="nt" x="245" y="232">1</text>
  <circle class="n" cx="560" cy="186" r="9"/><text class="nt" x="560" y="190">2</text>
  <circle class="n" cx="822.5" cy="150" r="9"/><text class="nt" x="822.5" y="154">3</text>
  <circle class="n" cx="560" cy="212" r="9"/><text class="nt" x="560" y="216">4</text>
  <circle class="n" cx="245" cy="262" r="9"/><text class="nt" x="245" y="266">5</text>
</svg>
