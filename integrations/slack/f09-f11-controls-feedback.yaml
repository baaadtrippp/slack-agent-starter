_metadata:
  major_version: 1
  minor_version: 1

# Keep the installed app identity and deployed URLs when applying this file.
display_information:
  name: REPLACE-ME
  description: A thread-based agent for one Slack workspace

features:
  bot_user:
    display_name: REPLACE-ME
    always_online: false

oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:read
      - chat:write
      - files:read
      - files:write
      - reactions:read
      - reactions:write
      - users:read

settings:
  event_subscriptions:
    request_url: https://example.invalid/api/slack/events
    bot_events:
      - app_mention
      - message.channels
      - reaction_added
      - reaction_removed
  interactivity:
    is_enabled: true
    request_url: https://example.invalid/api/slack/interactions
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
