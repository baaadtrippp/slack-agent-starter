_metadata:
  major_version: 1
  minor_version: 1

# Replace both names before creating the app. The product name is still an open decision.
display_information:
  name: REPLACE-ME
  description: A thread-based agent for one Slack workspace

features:
  bot_user:
    display_name: REPLACE-ME
    always_online: false

oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - chat:write
      - files:read
      - files:write
      - groups:history
      - reactions:write

settings:
  event_subscriptions:
    # Replace this placeholder after the gateway has a stable HTTPS endpoint.
    request_url: https://example.invalid/api/slack/events
    bot_events:
      - app_mention
      - message.channels
      - message.groups
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
