# This is a reviewable overlay, not a standalone Slack manifest.
# Merge it into manifest.yaml only after Stop/Status controls and thumbs feedback
# move from proposed behavior to accepted scope.

oauth_config:
  scopes:
    bot:
      - reactions:read

settings:
  event_subscriptions:
    bot_events:
      - reaction_added
      - reaction_removed
  interactivity:
    # Use the same gateway route family as events after the endpoint exists.
    request_url: https://example.invalid/api/slack/interactions
