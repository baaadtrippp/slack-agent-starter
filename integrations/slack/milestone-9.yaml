_metadata:
  major_version: 1
  minor_version: 1

display_information:
  name: REPLACE-ME
  description: A thread-based agent for one Slack workspace

features:
  bot_user:
    display_name: REPLACE-ME
    always_online: false

oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - files:read

settings:
  event_subscriptions:
    request_url: https://example.invalid/api/slack/events
    bot_events:
      - app_mention
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
